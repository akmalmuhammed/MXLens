name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install
      - name: Build engine (other packages resolve it)
        run: npm run build -w @mxlens/engine
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Accuracy gate
        run: npm run eval

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install
      - name: Build engine (web depends on it)
        run: npm run build -w @mxlens/engine
      - name: next build
        run: npm run build -w @mxlens/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      - name: Scan working tree
        run: gitleaks dir . --redact --verbose
