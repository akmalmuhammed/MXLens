name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: CLI smoke test
        run: |
          npm run build:cli
          node cli/dist/mxlens.mjs --fail-on malicious public/samples/demo-legitimate.eml
          if node cli/dist/mxlens.mjs --fail-on malicious public/samples/demo-phishing.eml; then
            echo "expected the phishing sample to fail" && exit 1
          fi

      # Built with an empty environment: MXLens must work with no configuration.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mxlens:ci .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      # Working tree only: this private repository's history contains removed
      # credentials. The public release starts from a fresh repository.
      - name: Scan working tree
        run: gitleaks dir . --redact --verbose
