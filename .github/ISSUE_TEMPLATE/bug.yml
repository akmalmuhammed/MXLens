name: Bug report
description: Something is broken in the web app, CLI or Docker image.
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Web app (hosted demo)
        - Web app (self-hosted)
        - CLI
        - Docker image
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "mxlens --version, image tag, or git commit"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: text
  - type: markdown
    attributes:
      value: "If an email is needed to reproduce, sanitize it first (see CONTRIBUTING.md)."
