name: Wrong verdict (false positive or missed phishing)
description: MXLens scored an email incorrectly.
labels: [detection]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach real emails.** Sanitize first: replace domains with example.com/.net/.org,
        IPs with 192.0.2.x / 198.51.100.x / 203.0.113.x, and remove names, tokens and attachments.
        See CONTRIBUTING.md.
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong?
      options:
        - Legitimate email flagged (false positive)
        - Phishing email not flagged (missed)
        - A specific finding is wrong
    validations:
      required: true
  - type: input
    id: verdict
    attributes:
      label: Verdict and risk score MXLens gave
      placeholder: "High Risk, 72/100"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and why
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Findings MXLens listed (CLI `--json` output or a screenshot)
  - type: textarea
    id: sample
    attributes:
      label: Sanitized sample (headers and minimal body)
      render: text
  - type: checkboxes
    id: sanitized
    attributes:
      label: Confirmation
      options:
        - label: I removed personal data, real domains and real IP addresses from anything attached.
          required: true
